name: Android Build v0.0.5

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v0.0.5'
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (v0.0.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "google-services.json not found, creating from secret or fallback..."
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            else
              cat << 'EOF' > app/google-services.json
              {
                "project_info": {
                  "project_number": "919509499769",
                  "firebase_url": "https://my-hidalguina-default-rtdb.firebaseio.com",
                  "project_id": "my-hidalguina",
                  "storage_bucket": "my-hidalguina.firebasestorage.app"
                },
                "client": [
                  {
                    "client_info": {
                      "mobilesdk_app_id": "1:919509499769:android:49e8fc9d1f71325447b9a8",
                      "android_client_info": {
                        "package_name": "com.triplebaka.myHidalguina.MF"
                      }
                    },
                    "oauth_client": [],
                    "api_key": [
                      {
                        "current_key": "AIzaSyBlKWXl9_R0pjiME5SDhKvGJFy2m854wSU"
                      }
                    ],
                    "services": {
                      "appinvite_service": {
                        "other_platform_oauth_client": []
                      }
                    }
                  }
                ],
                "configuration_version": "1"
              }
              EOF
            fi
          fi

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyHidalguina-v0.0.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
